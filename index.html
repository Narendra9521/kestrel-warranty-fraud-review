<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Kestrel claim check</title>
<style>body{font:15px system-ui;max-width:560px;margin:24px auto;padding:0 12px}label{display:block;margin:8px 0 2px;font-size:13px;color:#555}input,select{width:100%;padding:7px;box-sizing:border-box}button{margin-top:14px;padding:10px 16px}#r{margin-top:18px;padding:12px;border-radius:6px}.REVIEW{background:#fde2e2}.watch{background:#fff4d6}.normal{background:#e3f4e3}</style>
<h2>Warranty claim check</h2>
<label>Claim ID<input id=claim_id value=WC-NEW-1></label><label>Submitted at<input id=submitted_at value="2026-10-02 11:30"></label>
<label>Partner ID<input id=partner_id value=SP3129></label><label>SKU<input id=sku value=KH-CF-01></label>
<label>Days since purchase<input id=days_since_purchase type=number value=120></label><label>Claim amount (Rs)<input id=claim_amount_inr type=number value=1995></label>
<label>Photo attached<select id=photo_attached><option>Y<option>N</select></label><label>Inspected<select id=partner_inspected><option>N<option>Y</select></label>
<label>Customer's earlier claims<input id=customer_prior_claims type=number value=2></label>
<button onclick=go()>Check claim</button><div id=r></div>
<script>async function go(){const b={};document.querySelectorAll('input,select').forEach(e=>b[e.id]=e.value);
const o=document.getElementById('r');try{const x=await fetch('/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await x.json();
if(!x.ok){o.className='';o.textContent=j.error;return}o.className=j.recommendation;
o.innerHTML='<b>'+j.recommendation.toUpperCase()+'</b> (score '+j.risk_score+')<ul>'+j.reasons.map(t=>'<li>'+t+'</li>').join('')+'</ul><small>'+j.note+'</small>'}catch(e){o.className='';o.textContent='Service not reachable.'}}</script>
